<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Mes clients</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#111827}
  .app{max-width:1000px;margin:auto;padding:18px}
  h1{margin:0 0 16px;font-size:30px}
  .stats,.servers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
  .servers{grid-template-columns:repeat(3,1fr)}
  .card{border:0;border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.10);cursor:pointer;background:white}
  .stat-title{font-size:14px;font-weight:700}.stat-number{font-size:27px;font-weight:800;margin-top:4px}
  .blue{background:#dbeafe;color:#1d4ed8}.green{background:#dcfce7;color:#15803d}
  .orange{background:#ffedd5;color:#c2410c}.red{background:#fee2e2;color:#b91c1c}
  .edge{background:#e7d2bd;color:#7c4a22}.online{background:#e5e7eb;color:#374151}.omega{background:#fef3c7;color:#a16207}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
  input,select,button{font:inherit}
  input,select{padding:12px;border:1px solid #d1d5db;border-radius:12px;background:white}
  #search{flex:1;min-width:180px}
  button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
  .primary{background:#111827;color:white}
  .secondary{background:white;border:1px solid #d1d5db}
  .client{background:white;border-radius:16px;margin:12px 0;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .client-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
  .client-name{font-size:20px;font-weight:800}
  .meta{font-size:13px;color:#6b7280;margin-top:3px}
  .subs{display:grid;gap:8px}
  .sub{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:#f9fafb;border-left:6px solid #9ca3af}
  .sub.edge{border-left-color:#9a6a3a}.sub.online{border-left-color:#9ca3af}.sub.omega{border-left-color:#d4a017}
  .date{font-weight:700}
  .badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800;margin-left:6px}
  .badge.active{background:#dcfce7;color:#166534}.badge.soon{background:#ffedd5;color:#9a3412}.badge.expired{background:#fee2e2;color:#991b1b}
  .actions{display:flex;gap:7px;margin-top:12px}
  .empty{text-align:center;padding:30px;color:#6b7280}
  dialog{border:0;border-radius:18px;width:min(680px,calc(100% - 28px));padding:0;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .modal{padding:20px}.modal h2{margin-top:0}
  label{display:block;font-weight:700;margin:12px 0 6px}
  .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .choice{padding:12px;background:#f3f4f6;border-radius:12px;text-align:center;border:2px solid transparent;cursor:pointer}
  .choice.selected{border-color:#111827;background:#e5e7eb}
  .server-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin:8px 0}
  .server-row select,.server-row input{width:100%}
  .remove{background:#fee2e2;color:#991b1b;padding:10px}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  @media(max-width:700px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .servers{grid-template-columns:1fr}
    .server-row{grid-template-columns:1fr 1fr}
    .server-row .remove{grid-column:1/-1}
  }
</style>
</head>
<body>
<div class="app">
  <h1>Mes clients</h1>

  <div class="stats">
    <div class="card blue" data-status="all"><div class="stat-title">Clients</div><div class="stat-number" id="countClients">0</div></div>
    <div class="card green" data-status="active"><div class="stat-title">Actifs</div><div class="stat-number" id="countActive">0</div></div>
    <div class="card orange" data-status="soon"><div class="stat-title">≤ 7 jours</div><div class="stat-number" id="countSoon">0</div></div>
    <div class="card red" data-status="expired"><div class="stat-title">Expirés</div><div class="stat-number" id="countExpired">0</div></div>
  </div>

  <div class="servers">
    <div class="card edge" data-server="Edge"><div class="stat-title">Edge</div><div class="stat-number" id="countEdge">0</div></div>
    <div class="card online" data-server="ONline"><div class="stat-title">ONline</div><div class="stat-number" id="countONline">0</div></div>
    <div class="card omega" data-server="Omega"><div class="stat-title">Omega</div><div class="stat-number" id="countOmega">0</div></div>
  </div>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Rechercher un client...">
    <select id="sort">
      <option value="az">Ordre alphabétique (A → Z)</option>
      <option value="za">Ordre alphabétique (Z → A)</option>
      <option value="near">Date de renouvellement — plus proche</option>
      <option value="far">Date de renouvellement — plus éloignée</option>
    </select>
    <button class="primary" id="addBtn">+ Ajouter un client</button>
  </div>

  <div id="activeFilters"></div>
  <div id="list"></div>
</div>

<dialog id="dlg">
  <form method="dialog" class="modal" id="clientForm">
    <h2 id="modalTitle">Ajouter un client</h2>
    <input type="hidden" id="editId">

    <label for="name">Nom du client</label>
    <input id="name" required style="width:100%" placeholder="Nom">

    <label>Nombre d'abonnements</label>
    <div class="choices" id="subChoices">
      <div class="choice selected" data-value="1">1 abonnement</div>
      <div class="choice" data-value="2">2 abonnements</div>
      <div class="choice" data-value="3">3 abonnements et +</div>
    </div>

    <label>Nombre d'appareils</label>
    <div class="choices" id="deviceChoices">
      <div class="choice selected" data-value="1">1 appareil</div>
      <div class="choice" data-value="2">2 appareils</div>
      <div class="choice" data-value="3">3 appareils</div>
      <div class="choice" data-value="4">4 appareils</div>
      <div class="choice" data-value="5">5 appareils</div>
    </div>

    <label>Abonnements</label>
    <div id="serverRows"></div>
    <button type="button" class="secondary" id="addServer">+ Ajouter un abonnement</button>

    <div class="modal-actions">
      <button type="button" class="secondary" id="cancelBtn">Annuler</button>
      <button type="submit" class="primary">Enregistrer</button>
    </div>
  </form>
</dialog>

<script>
const KEY='mes-clients-v2';
let clients=[];
try{clients=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){clients=[]}

let statusFilter='all';
let serverFilter='all';
let sortMode='az';

const $=id=>document.getElementById(id);
const dlg=$('dlg');

function save(){localStorage.setItem(KEY,JSON.stringify(clients));render();}

function daysLeft(date){
  const d=new Date(date+'T23:59:59');
  const now=new Date();
  return Math.ceil((d-now)/86400000);
}
function statusOf(date){
  const d=daysLeft(date);
  if(d<0)return'expired';
  if(d<=7)return'soon';
  return'active';
}
function fmt(date){
  if(!date)return'';
  const p=date.split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : date;
}
function earliest(c){
  return c.servers.length ? Math.min(...c.servers.map(s=>new Date(s.expiry+'T23:59:59').getTime())) : Infinity;
}

function filtered(){
  const q=$('search').value.trim().toLowerCase();
  let arr=clients.filter(c=>c.name.toLowerCase().includes(q));
  if(statusFilter!=='all'){
    arr=arr.filter(c=>c.servers.some(s=>statusOf(s.expiry)===statusFilter));
  }
  if(serverFilter!=='all'){
    arr=arr.filter(c=>c.servers.some(s=>s.server===serverFilter));
  }
  arr.sort((a,b)=>{
    if(sortMode==='az')return a.name.localeCompare(b.name,'fr',{sensitivity:'base'});
    if(sortMode==='za')return b.name.localeCompare(a.name,'fr',{sensitivity:'base'});
    const x=earliest(a),y=earliest(b);
    return sortMode==='near'?x-y:y-x;
  });
  return arr;
}

function render(){
  let totalServers=0,active=0,soon=0,expired=0,edge=0,online=0,omega=0;
  clients.forEach(c=>c.servers.forEach(s=>{
    totalServers++;
    const st=statusOf(s.expiry);
    if(st==='active')active++; if(st==='soon')soon++; if(st==='expired')expired++;
    if(s.server==='Edge')edge++; if(s.server==='ONline')online++; if(s.server==='Omega')omega++;
  }));
  $('countClients').textContent=clients.length;
  $('countActive').textContent=active;
  $('countSoon').textContent=soon;
  $('countExpired').textContent=expired;
  $('countEdge').textContent=edge;
  $('countONline').textContent=online;
  $('countOmega').textContent=omega;

  const filters=[];
  if(statusFilter!=='all')filters.push(statusFilter==='active'?'Actifs':statusFilter==='soon'?'≤ 7 jours':'Expirés');
  if(serverFilter!=='all')filters.push(serverFilter);
  $('activeFilters').innerHTML=filters.length
    ? '<div style="margin:8px 0;color:#374151;font-weight:700">Filtre : '+filters.join(' • ')+' <button type="button" class="secondary" id="clearFilters" style="padding:6px 10px;margin-left:6px">Effacer</button></div>'
    : '';
  const clear=$('clearFilters'); if(clear)clear.onclick=()=>{statusFilter='all';serverFilter='all';render()};

  const list=$('list');
  const arr=filtered();
  if(!arr.length){list.innerHTML='<div class="empty">Aucun client à afficher.</div>';return;}
  list.innerHTML=arr.map(c=>{
    const rows=c.servers.map((s,i)=>{
      const st=statusOf(s.expiry), dl=daysLeft(s.expiry);
      const label=st==='expired'?'Expiré':(dl===0?'Expire aujourd’hui':dl+' jour'+(dl>1?'s':''));
      return `<div class="sub ${s.server.toLowerCase()}">
        <div><strong>${escapeHtml(s.server)}</strong><div class="meta">Expiration : <span class="date">${fmt(s.expiry)}</span></div></div>
        <span class="badge ${st}">${label}</span>
      </div>`;
    }).join('');
    return `<div class="client">
      <div class="client-head">
        <div><div class="client-name">${escapeHtml(c.name)}</div><div class="meta">${c.servers.length} abonnement${c.servers.length>1?'s':''} • ${c.devices} appareil${c.devices>1?'s':''}</div></div>
      </div>
      <div class="subs">${rows}</div>
      <div class="actions">
        <button class="secondary edit" data-id="${c.id}">Modifier</button>
        <button class="secondary del" data-id="${c.id}">Supprimer</button>
      </div>
    </div>`;
  }).join('');

  document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>openEdit(b.dataset.id));
  document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{
    if(confirm('Supprimer ce client ?')){clients=clients.filter(c=>c.id!==b.dataset.id);save();}
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function setChoice(group,value){
  document.querySelectorAll('#'+group+' .choice').forEach(x=>x.classList.toggle('selected',x.dataset.value===String(value)));
}
function getChoice(group){
  return Number(document.querySelector('#'+group+' .choice.selected')?.dataset.value||1);
}

function addRow(data={server:'Edge',expiry:''}){
  const row=document.createElement('div');
  row.className='server-row';
  row.innerHTML=`<div><label>Serveur</label><select class="srv">
    <option>Edge</option><option>ONline</option><option>Omega</option>
  </select></div>
  <div><label>Date d'expiration</label><input class="exp" type="date" required></div>
  <button type="button" class="remove">Supprimer</button>`;
  row.querySelector('.srv').value=data.server;
  row.querySelector('.exp').value=data.expiry;
  row.querySelector('.remove').onclick=()=>row.remove();
  $('serverRows').appendChild(row);
}

function openNew(){
  $('modalTitle').textContent='Ajouter un client';
  $('editId').value=''; $('name').value='';
  setChoice('subChoices',1); setChoice('deviceChoices',1);
  $('serverRows').innerHTML=''; addRow();
  dlg.showModal();
}
function openEdit(id){
  const c=clients.find(x=>x.id===id); if(!c)return;
  $('modalTitle').textContent='Modifier un client';
  $('editId').value=c.id; $('name').value=c.name;
  setChoice('subChoices',Math.min(3,c.servers.length));
  setChoice('deviceChoices',Math.min(5,Math.max(1,Number(c.devices)||1)));
  $('serverRows').innerHTML='';
  c.servers.forEach(s=>addRow(s));
  dlg.showModal();
}

document.querySelectorAll('#subChoices .choice').forEach(x=>x.onclick=()=>{
  setChoice('subChoices',x.dataset.value);
  const n=Number(x.dataset.value);
  const rows=[...document.querySelectorAll('.server-row')];
  while(rows.length<n){addRow();rows.push(document.querySelectorAll('.server-row')[document.querySelectorAll('.server-row').length-1]);}
  while(document.querySelectorAll('.server-row').length>n)document.querySelector('.server-row:last-child').remove();
});
document.querySelectorAll('#deviceChoices .choice').forEach(x=>x.onclick=()=>setChoice('deviceChoices',x.dataset.value));
$('addServer').onclick=()=>addRow();
$('addBtn').onclick=openNew;
$('cancelBtn').onclick=()=>dlg.close();
$('search').oninput=render;
$('sort').onchange=e=>{sortMode=e.target.value;render()};

document.querySelectorAll('[data-status]').forEach(c=>c.onclick=()=>{
  const v=c.dataset.status;
  statusFilter=statusFilter===v?'all':v;
  render();
});
document.querySelectorAll('[data-server]').forEach(c=>c.onclick=()=>{
  const v=c.dataset.server;
  serverFilter=serverFilter===v?'all':v;
  render();
});

$('clientForm').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('name').value.trim();
  const rows=[...document.querySelectorAll('.server-row')];
  const servers=rows.map(r=>({server:r.querySelector('.srv').value,expiry:r.querySelector('.exp').value})).filter(s=>s.expiry);
  if(!name||!servers.length){alert('Entre le nom et au moins une date d’expiration.');return;}
  const id=$('editId').value;
  const obj={id:id||Date.now().toString(),name,subscriptions:servers.length,devices:getChoice('deviceChoices'),servers};
  if(id){const i=clients.findIndex(c=>c.id===id);if(i>=0)clients[i]=obj;}
  else clients.push(obj);
  save();dlg.close();
});

render();
</script>
</body>
</html>
