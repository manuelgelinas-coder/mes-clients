<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10213b"><link rel="manifest" href="manifest.json"><title>Mes clients</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6fa;color:#172033}header{background:#10213b;color:#fff;padding:24px 18px 18px;border-radius:0 0 22px 22px}h1{margin:0 0 16px;font-size:28px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff1;border-radius:14px;padding:14px}.stat b{display:block;font-size:25px}.green{background:#168c55}.orange{background:#c88714}.red{background:#c7393f}.blue{background:#265b99}.container{padding:16px;max-width:800px;margin:auto}.search{width:100%;padding:14px 16px;border:1px solid #d9dfe8;border-radius:14px;font-size:16px;margin-bottom:14px}.servers{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.chip{border:0;padding:9px 13px;border-radius:999px;background:#fff;box-shadow:0 1px 4px #0001}.chip.active{background:#10213b;color:#fff}.client{background:#fff;border-radius:15px;padding:15px;margin:9px 0;box-shadow:0 2px 8px #0000000b;display:flex;justify-content:space-between;align-items:center}.name{font-weight:700}.meta{font-size:13px;color:#657085;margin-top:5px}.badge{font-size:12px;font-weight:700;padding:7px 9px;border-radius:999px}.bgreen{background:#dcf7e8;color:#14733f}.borange{background:#fff0cf;color:#95600a}.bred{background:#ffe0e2;color:#a92128}.fab{position:fixed;right:20px;bottom:22px;width:58px;height:58px;border:0;border-radius:50%;background:#1677f5;color:white;font-size:30px;box-shadow:0 5px 18px #0003}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:800px;border-radius:22px 22px 0 0;padding:22px}.sheet h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:13px;border:1px solid #d4dbe6;border-radius:11px;font-size:16px}.actions{display:flex;gap:10px;margin-top:18px}.btn{flex:1;padding:14px;border:0;border-radius:12px;font-weight:700;font-size:16px}.primary{background:#1677f5;color:white}.secondary{background:#e9edf3}.danger{background:#ffe0e2;color:#a92128}.detail{display:none}.detail.open{display:block}.back{background:none;border:0;padding:0 0 14px;font-size:16px}.renew{width:100%;padding:14px;border:0;border-radius:12px;background:#18a85a;color:#fff;font-size:17px;font-weight:700;margin:12px 0}.history{background:#f6f7f9;border-radius:12px;padding:12px}.empty{text-align:center;color:#687386;padding:35px}
</style></head>
<body>
<header><h1>Mes clients</h1><div class="stats"><div class="stat blue"><b id="total">0</b>Clients</div><div class="stat green"><b id="active">0</b>Actifs</div><div class="stat orange"><b id="soon">0</b>≤ 7 jours</div><div class="stat red"><b id="expired">0</b>Expirés</div></div></header>
<div class="container" id="main"><input class="search" id="search" placeholder="🔎 Rechercher un client..."><div class="servers"><button class="chip active" data-server="Tous">Tous</button><button class="chip" data-server="Edge">Edge</button><button class="chip" data-server="ONline">ONline</button><button class="chip" data-server="Omega">Omega</button></div><div id="list"></div></div>
<button class="fab" id="add">+</button>
<div class="modal" id="modal"><div class="sheet"><h2 id="formTitle">Ajouter un client</h2><div class="field"><label>Nom du client</label><input id="name" autocomplete="off"></div><div class="field"><label>Serveur</label><select id="server"><option>Edge</option><option>ONline</option><option>Omega</option></select></div><div class="field"><label>Date d'expiration</label><input id="expiry" type="date"></div><div class="actions"><button class="btn secondary" id="cancel">Annuler</button><button class="btn primary" id="save">Enregistrer</button></div></div></div>
<div class="modal" id="detailModal"><div class="sheet"><button class="back" id="closeDetail">← Retour</button><h2 id="detailName"></h2><div id="detailInfo"></div><button class="renew" id="renew">↻ Renouveler</button><div class="history"><b>Historique des renouvellements</b><div id="history"></div></div><div class="actions"><button class="btn danger" id="delete">Supprimer</button></div></div></div>
<script>
const KEY='mesClientsV1';let clients=JSON.parse(localStorage.getItem(KEY)||'[]');let editing=null;let selectedServer='Tous';
const $=id=>document.getElementById(id);function saveData(){localStorage.setItem(KEY,JSON.stringify(clients))}function dayDiff(d){const a=new Date();a.setHours(0,0,0,0);const b=new Date(d+'T00:00:00');return Math.ceil((b-a)/86400000)}function status(c){let d=dayDiff(c.expiry);return d<0?['Expiré','bred']:d<=7?['≤ 7 jours','borange']:['Actif','bgreen']}function fmt(d){return new Intl.DateTimeFormat('fr-CA',{day:'numeric',month:'short',year:'numeric'}).format(new Date(d+'T00:00:00'))}
function render(){const q=$('search').value.toLowerCase();let arr=clients.filter(c=>(selectedServer==='Tous'||c.server===selectedServer)&&c.name.toLowerCase().includes(q)).sort((a,b)=>a.expiry.localeCompare(b.expiry));$('total').textContent=clients.length;$('active').textContent=clients.filter(c=>dayDiff(c.expiry)>7).length;$('soon').textContent=clients.filter(c=>dayDiff(c.expiry)>=0&&dayDiff(c.expiry)<=7).length;$('expired').textContent=clients.filter(c=>dayDiff(c.expiry)<0).length;$('list').innerHTML=arr.length?arr.map(c=>{const s=status(c);return `<div class="client" onclick="openDetail('${c.id}')"><div><div class="name">${esc(c.name)}</div><div class="meta">${c.server} · ${fmt(c.expiry)}</div></div><span class="badge ${s[1]}">${s[0]}</span></div>`}).join(''):'<div class="empty">Aucun client trouvé</div>'}
function esc(s){return s.replace(/[&<>'"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[x]))}
$('add').onclick=()=>{editing=null;$('formTitle').textContent='Ajouter un client';$('name').value='';$('server').value='Edge';$('expiry').value='';$('modal').classList.add('open')};$('cancel').onclick=()=>$('modal').classList.remove('open');$('save').onclick=()=>{const name=$('name').value.trim(),expiry=$('expiry').value;if(!name||!expiry)return alert('Veuillez remplir le nom et la date.');if(editing){const c=clients.find(x=>x.id===editing);c.name=name;c.server=$('server').value;c.expiry=expiry}else clients.push({id:crypto.randomUUID(),name,server:$('server').value,expiry,history:[]});saveData();$('modal').classList.remove('open');render()};$('search').oninput=render;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedServer=b.dataset.server;render()});
function openDetail(id){const c=clients.find(x=>x.id===id);$('detailName').textContent=c.name;const s=status(c),d=dayDiff(c.expiry);$('detailInfo').innerHTML=`<p><b>Serveur :</b> ${c.server}</p><p><b>Date d'expiration :</b> ${fmt(c.expiry)}</p><span class="badge ${s[1]}">${d<0?'Expiré depuis '+Math.abs(d)+' jour(s)':d===0?'Expire aujourd’hui':'Expire dans '+d+' jour(s)'}</span>`;$('history').innerHTML=(c.history||[]).length?c.history.map(x=>`<p>📅 ${fmt(x)}</p>`).join(''):'<p>Aucun renouvellement précédent.</p>';$('detailModal').dataset.id=id;$('detailModal').classList.add('open')}
$('closeDetail').onclick=()=>$('detailModal').classList.remove('open');$('renew').onclick=()=>{const c=clients.find(x=>x.id===$('detailModal').dataset.id);const old=c.expiry;const base=new Date(Math.max(new Date(old+'T00:00:00').getTime(),Date.now()));base.setDate(base.getDate()+30);c.history=c.history||[];c.history.unshift(old);c.expiry=base.toISOString().slice(0,10);saveData();openDetail(c.id);render()};$('delete').onclick=()=>{const id=$('detailModal').dataset.id;if(confirm('Supprimer ce client ?')){clients=clients.filter(c=>c.id!==id);saveData();$('detailModal').classList.remove('open');render()}};render();
</script></body></html>
