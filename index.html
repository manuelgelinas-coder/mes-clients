<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10213b">
<title>Mes clients</title>
  
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fa;
  color:#172033;
}
header{
  background:#10213b;
  color:white;
  padding:28px 20px 30px;
  border-radius:0 0 32px 32px;
}
header h1{
  margin:0 0 25px;
  font-size:34px;
}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.stat{
  padding:22px;
  border-radius:22px;
  color:white;
}
.stat strong{
  display:block;
  font-size:40px;
  line-height:1;
  margin-bottom:8px;
}
.stat span{font-size:18px}
.blue{background:#2d67a8}
.green{background:#15945b}
.orange{background:#d39112}
.red{background:#cc3841}

.container{
  padding:26px 20px 110px;
  max-width:850px;
  margin:auto;
}
.search{
  width:100%;
  padding:18px 20px;
  border:1px solid #ddd;
  border-radius:20px;
  font-size:18px;
  background:white;
  outline:none;
}
.filters{
  display:flex;
  gap:10px;
  overflow:auto;
  padding:18px 0;
}
.filter{
  border:0;
  background:white;
  padding:13px 22px;
  border-radius:30px;
  font-size:17px;
  white-space:nowrap;
}
.filter.active{
  background:#10213b;
  color:white;
}
.card{
  background:white;
  border-radius:22px;
  padding:20px;
  margin:12px 0;
  box-shadow:0 4px 15px #0000000d;
  cursor:pointer;
}
.card-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
}
.card h3{
  margin:0 0 7px;
  font-size:21px;
}
.card p{
  margin:0;
  color:#697386;
  font-size:16px;
}
.badge{
  padding:9px 13px;
  border-radius:20px;
  font-size:14px;
  white-space:nowrap;
}
.badge.active{background:#dff6e9;color:#08763f}
.badge.soon{background:#fff0c9;color:#9a6900}
.badge.expired{background:#ffe0e2;color:#a71924}

.empty{
  text-align:center;
  color:#8a93a3;
  padding:60px 10px;
  font-size:18px;
}

.fab{
  position:fixed;
  right:25px;
  bottom:28px;
  width:66px;
  height:66px;
  border:0;
  border-radius:50%;
  background:#1677ed;
  color:white;
  font-size:38px;
  box-shadow:0 8px 25px #0003;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:10;
  align-items:flex-end;
  justify-content:center;
}
.sheet{
  background:white;
  width:100%;
  max-width:700px;
  border-radius:28px 28px 0 0;
  padding:25px;
  max-height:90vh;
  overflow:auto;
}
.sheet h2{
  margin-top:0;
}
label{
  display:block;
  margin:16px 0 7px;
  font-weight:bold;
}
input,select{
  width:100%;
  padding:15px;
  border:1px solid #d5d9e0;
  border-radius:14px;
  font-size:17px;
}
.actions{
  display:flex;
  gap:10px;
  margin-top:22px;
}
.actions button{
  flex:1;
  padding:15px;
  border:0;
  border-radius:15px;
  font-size:17px;
  font-weight:bold;
}
.primary{background:#1677ed;color:white}
.secondary{background:#e9edf3}
.danger{background:#d73540;color:white}
.renew{background:#15945b;color:white}

.detail-line{
  padding:13px 0;
  border-bottom:1px solid #eee;
}
.detail-line strong{
  display:block;
  margin-bottom:4px;
}
</style>
</head>

<body>

<header>
  <h1>Mes clients</h1>

  <div class="stats">
    <div class="stat blue">
      <strong id="total">0</strong>
      <span>Clients</span>
    </div>

    <div class="stat green">
      <strong id="active">0</strong>
      <span>Actifs</span>
    </div>

    <div class="stat orange">
      <strong id="soon">0</strong>
      <span>≤ 7 jours</span>
    </div>

    <div class="stat red">
      <strong id="expired">0</strong>
      <span>Expirés</span>
    </div>
  </div>
</header>

<div class="container">

  <input
    id="search"
    class="search"
    placeholder="🔎 Rechercher un client..."
  >

  <div class="filters">
    <button class="filter active" data-filter="Tous">Tous</button>
    <button class="filter" data-filter="Edge">Edge</button>
    <button class="filter" data-filter="ONline">ONline</button>
    <button class="filter" data-filter="Omega">Omega</button>
  </div>

  <div id="main"></div>

</div>

<button class="fab" id="add">+</button>

<!-- AJOUT / MODIFICATION -->
<div class="modal" id="modal">
  <div class="sheet">

    <h2 id="formTitle">Ajouter un client</h2>

    <label>Nom du client</label>
    <input id="name" autocomplete="off">

    <label>Serveur</label>
    <select id="server">
      <option value="Edge">Edge</option>
      <option value="ONline">ONline</option>
      <option value="Omega">Omega</option>
    </select>

    <label>Date d'expiration</label>
    <input id="expiry" type="date">

    <div class="actions">
      <button class="secondary" id="cancel">Annuler</button>
      <button class="primary" id="save">Enregistrer</button>
    </div>

  </div>
</div>

<!-- DÉTAIL -->
<div class="modal" id="detailModal">
  <div class="sheet">

    <h2 id="detailName"></h2>

    <div class="detail-line">
      <strong>Serveur</strong>
      <span id="detailServer"></span>
    </div>

    <div class="detail-line">
      <strong>Date d'expiration</strong>
      <span id="detailExpiry"></span>
    </div>

    <div class="actions">
      <button class="secondary" id="closeDetail">Fermer</button>
      <button class="primary" id="editDetail">Modifier</button>
    </div>

    <!-- BOUTON RENOUVELER CONSERVÉ -->
    <div class="actions">
      <button class="renew" id="renew">Renouveler</button>
      <button class="danger" id="delete">Supprimer</button>
    </div>

  </div>
</div>

<script>
const KEY='mesClientsV1';

let clients=JSON.parse(localStorage.getItem(KEY)||'[]');
let editing=null;
let selectedId=null;
let currentFilter='Tous';

const $=id=>document.getElementById(id);

function saveData(){
  localStorage.setItem(KEY,JSON.stringify(clients));
}

function today(){
  const d=new Date();
  d.setHours(0,0,0,0);
  return d;
}

function dateFromString(s){
  const [y,m,d]=s.split('-').map(Number);
  return new Date(y,m-1,d);
}

function daysLeft(date){
  const diff=dateFromString(date)-today();
  return Math.ceil(diff/86400000);
}

function status(client){
  const days=daysLeft(client.expiry);

  if(days<0){
    return {type:'expired',text:'Expiré'};
  }

  if(days<=7){
    return {
      type:'soon',
      text:days===0?'Aujourd’hui':days===1?'1 jour':days+' jours'
    };
  }

  return {type:'active',text:'Actif'};
}

function formatDate(date){
  return dateFromString(date).toLocaleDateString('fr-CA',{
    day:'numeric',
    month:'short',
    year:'numeric'
  });
}

function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[m]));
}

function render(){

  const q=$('search').value.trim().toLowerCase();

  const filtered=clients
    .filter(c=>currentFilter==='Tous'||c.server===currentFilter)
    .filter(c=>
      c.name.toLowerCase().includes(q) ||
      c.server.toLowerCase().includes(q)
    )
    .sort((a,b)=>dateFromString(a.expiry)-dateFromString(b.expiry));

  $('total').textContent=clients.length;
  $('active').textContent=clients.filter(c=>status(c).type==='active').length;
  $('soon').textContent=clients.filter(c=>status(c).type==='soon').length;
  $('expired').textContent=clients.filter(c=>status(c).type==='expired').length;

  if(!filtered.length){
    $('main').innerHTML='<div class="empty">Aucun client trouvé</div>';
    return;
  }

  $('main').innerHTML=filtered.map(c=>{
    const s=status(c);

    return `
      <div class="card" onclick="openDetail('${c.id}')">
        <div class="card-top">
          <div>
            <h3>${esc(c.name)}</h3>
            <p>${esc(c.server)} · ${formatDate(c.expiry)}</p>
          </div>
          <span class="badge ${s.type}">
            ${s.type==='active'?'Actif':s.type==='expired'?'Expiré':'≤ 7 jours'}
          </span>
        </div>
      </div>
    `;
  }).join('');
}

$('search').addEventListener('input',render);

document.querySelectorAll('.filter').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.filter')
      .forEach(b=>b.classList.remove('active'));

    btn.classList.add('active');
    currentFilter=btn.dataset.filter;
    render();
  };
});

$('add').onclick=()=>{
  editing=null;
  $('formTitle').textContent='Ajouter un client';
  $('name').value='';
  $('server').value='Edge';
  $('expiry').value='';
  $('modal').style.display='flex';
};

$('cancel').onclick=()=>{
  $('modal').style.display='none';
};

$('save').onclick=()=>{

  const name=$('name').value.trim();
  const server=$('server').value;
  const expiry=$('expiry').value;

  if(!name||!expiry){
    alert('Veuillez remplir tous les champs.');
    return;
  }

  if(editing){
    const c=clients.find(x=>x.id===editing);

    if(c){
      c.name=name;
      c.server=server;
      c.expiry=expiry;
    }

  }else{

    clients.push({
      id:Date.now().toString(),
      name,
      server,
      expiry
    });

  }

  saveData();
  $('modal').style.display='none';
  render();
};

window.openDetail=id=>{
  const c=clients.find(x=>x.id===id);
  if(!c)return;

  selectedId=id;

  $('detailName').textContent=c.name;
  $('detailServer').textContent=c.server;
  $('detailExpiry').textContent=formatDate(c.expiry);

  $('detailModal').style.display='flex';
};

$('closeDetail').onclick=()=>{
  $('detailModal').style.display='none';
};

$('editDetail').onclick=()=>{
  const c=clients.find(x=>x.id===selectedId);
  if(!c)return;

  editing=c.id;

  $('formTitle').textContent='Modifier le client';
  $('name').value=c.name;
  $('server').value=c.server;
  $('expiry').value=c.expiry;

  $('detailModal').style.display='none';
  $('modal').style.display='flex';
};

/*
  RENOUVELLEMENT ACTUEL :
  +30 jours
*/
$('renew').onclick=()=>{
  const c=clients.find(x=>x.id===selectedId);
  if(!c)return;

  const base=daysLeft(c.expiry)<0 ? today() : dateFromString(c.expiry);

  base.setDate(base.getDate()+30);

  const y=base.getFullYear();
  const m=String(base.getMonth()+1).padStart(2,'0');
  const d=String(base.getDate()).padStart(2,'0');

  c.expiry=`${y}-${m}-${d}`;

  saveData();

  $('detailExpiry').textContent=formatDate(c.expiry);

  render();
};

$('delete').onclick=()=>{
  const c=clients.find(x=>x.id===selectedId);
  if(!c)return;

  if(!confirm('Supprimer ce client ?'))return;

  clients=clients.filter(x=>x.id!==selectedId);

  saveData();

  $('detailModal').style.display='none';
  render();
};

render();
</script>
  
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
</body>
</html>
